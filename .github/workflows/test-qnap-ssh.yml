name: Test Cosmos QNAP SSH (no deploy)

# Tests credentials and SSH restrictions ONLY. Does not rebuild, back up,
# restart, or otherwise change the live Cosmos app.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Join private QNAP tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cosmos-ci

      - name: Verify restricted deploy SSH key (does not deploy)
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.COSMOS_DEPLOY_SSH_KEY }}
          QNAP_KNOWN_HOSTS: ${{ secrets.COSMOS_QNAP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY" || { echo "Missing COSMOS_DEPLOY_SSH_KEY"; exit 1; }
          test -n "$QNAP_KNOWN_HOSTS" || { echo "Missing COSMOS_QNAP_KNOWN_HOSTS"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/cosmos-deploy"
          printf '%s\n' "$QNAP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cosmos-deploy" "$HOME/.ssh/known_hosts"

          # 0000 is intentionally too short to be a commit. The forced-command
          # receiver must reject it before reading stdin or changing anything.
          set +e
          output=$(ssh -T \
            -i "$HOME/.ssh/cosmos-deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            PhoeAung@100.120.3.104 "cosmos-deploy 0000" \
            </dev/null 2>&1)
          status=$?
          set -e

          if [ "$status" -ne 2 ] || [[ "$output" != *"Commit SHA must be exactly 40 hex characters"* ]]; then
            echo "SSH test failed. Diagnostic output:"
            printf '%s\n' "$output"
            exit 1
          fi
          echo "SUCCESS: Tailscale and SSH credentials work. QNAP restricted command rejected invalid SHA."
          echo "NO CODE WAS DEPLOYED."
