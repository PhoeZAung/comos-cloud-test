name: Publish Cosmos to QNAP

# This workflow NEVER runs on push, PR, or schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmos-qnap-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the approved main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Test Cosmos
        run: |
          npm ci
          npm test
          npm run build:cloud

      - name: Package only tracked source files
        run: git archive --format=tar HEAD | gzip -9 > "$RUNNER_TEMP/cosmos-source.tar.gz"

      - name: Connect privately to the QNAP tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cosmos-ci

      - name: Publish approved commit to QNAP
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.COSMOS_DEPLOY_SSH_KEY }}
          QNAP_KNOWN_HOSTS: ${{ secrets.COSMOS_QNAP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY"
          test -n "$QNAP_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/cosmos-deploy"
          printf '%s\n' "$QNAP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cosmos-deploy" "$HOME/.ssh/known_hosts"
          ssh -T \
            -i "$HOME/.ssh/cosmos-deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            PhoeAung@100.120.3.104 \
            "cosmos-deploy $GITHUB_SHA" \
            < "$RUNNER_TEMP/cosmos-source.tar.gz"
