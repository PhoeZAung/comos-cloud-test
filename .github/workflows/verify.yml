name: Verify rules and live build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Build and run complete tests
        run: npm test
